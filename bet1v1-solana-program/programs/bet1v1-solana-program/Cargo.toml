[package]
name = "bet1v1-solana-program"
version = "0.1.0"
description = "Created with Anchor"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "bet1v1_solana_program"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]


[dependencies]
anchor-lang = { version = "0.31.0", features = ["init-if-needed"] }
anchor-spl = "0.31.0"
blake3 = "=1.8.2"
borsh = "=1.5.7"
borsh-derive = "=1.5.7"
indexmap = "=2.13.0"
proc-macro-crate = "=3.2.0"
unicode-segmentation = "=1.12.0"
zeroize = "=1.8.1"
zeroize_derive = "=1.4.2"
