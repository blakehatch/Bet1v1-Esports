services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: bet1v1
      POSTGRES_USER: bet1v1
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bet1v1}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bet1v1"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  api:
    build: ./api
    environment: &api-environment
      PORT: 3001
      DATABASE_URL: postgres://bet1v1:${POSTGRES_PASSWORD:-bet1v1}@postgres:5432/bet1v1
      REDIS_URL: redis://redis:6379
      SOLANA_RPC_URL: ${SOLANA_RPC_URL:-http://host.docker.internal:8899}
      PROGRAM_ID: ${PROGRAM_ID:-8rqv4B1Sw4xweu4kWEHGnqoTQbQvRKuxSturDsz32i4v}
      TOKEN_MINT: ${TOKEN_MINT:-So11111111111111111111111111111111111111112}
      USDC_MINT: ${USDC_MINT:-4zMMC9srt5Ri5X14GAgXhaHii3GnPAEERYPJgZJDncDU}
      MOCK_CHAIN: ${MOCK_CHAIN:-true}
      STAKING_ENABLED: ${STAKING_ENABLED:-false}
      WAGER_ID_FLOOR: ${WAGER_ID_FLOOR:-1}
      MOCK_REQUIRED_STAKE: ${MOCK_REQUIRED_STAKE:-1000000000}
      ADMIN_KEY: ${ADMIN_KEY:-local-admin}
      CS2_SERVER_ADDRESS: ${CS2_SERVER_ADDRESS:-127.0.0.1:27015}
      QUAKE3_SERVER_ADDRESS: ${QUAKE3_SERVER_ADDRESS:-127.0.0.1:27961}
      QUAKE3_STATUS_HOST: bet1v1-quake-3-js-server
      QUAKE3_STATUS_PORT: 27960
      QUAKE3_FRAG_LIMIT: ${QUAKE3_FRAG_LIMIT:-10}
      Q3JS_EVENT_CLIENT_SECRET: ${Q3JS_EVENT_CLIENT_SECRET:-bet1v1-q3-local-event-secret-change-me}
      Q3JS_CLIENT_URL: ${Q3JS_CLIENT_URL:-https://q3js.com/play}
      Q3JS_SECURE: ${Q3JS_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  worker:
    build: ./api
    command: ["node", "dist/worker.js"]
    environment:
      <<: *api-environment
      CHAIN_AUTHORITY_SECRET: ${CHAIN_AUTHORITY_SECRET:-}
      CHAIN_AUTHORITY_KEYPAIR: /run/secrets/chain-automation-keypair.json
      Q3JS_RCON_PASSWORD: ${Q3JS_RCON_PASSWORD:-}
    volumes:
      - ./bet1v1-solana-program/chain-automation-keypair.json:/run/secrets/chain-automation-keypair.json:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  app:
    build:
      context: ./app
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_SOLANA_RPC_URL: ${VITE_SOLANA_RPC_URL:-http://127.0.0.1:8899}
        VITE_TOKEN_DECIMALS: ${VITE_TOKEN_DECIMALS:-9}
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-3000}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  cs2:
    profiles: ["cs2"]
    build:
      context: https://github.com/kus/cs2-modded-server.git#master
    environment:
      API_KEY: ${STEAM_API_KEY:-}
      STEAM_ACCOUNT: ${STEAM_ACCOUNT:-}
      RCON_PASSWORD: ${RCON_PASSWORD:-bet1v1-local}
      SERVER_PASSWORD: ${SERVER_PASSWORD:-}
      MAXPLAYERS: 2
      PORT: 27015
      LAN: ${CS2_LAN:-0}
      EXEC: on_boot.cfg
    ports:
      - "27015:27015/tcp"
      - "27015:27015/udp"
      - "27020:27020/tcp"
      - "27020:27020/udp"
    volumes:
      - cs2-data:/home/steam
      - ./cs2/custom_files:/home/custom_files
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4G

  bet1v1-quake-3-js-server:
    profiles: ["bet1v1-quake-3-js-server"]
    build:
      context: ./bet1v1-quake-3-js-server
    image: bet1v1-q3js-server
    environment:
      Q3JS_GAME_HOST: 0.0.0.0
      Q3JS_MASTER_URL: ${Q3JS_MASTER_URL:-http://127.0.0.1:8080}
      Q3JS_EVENT_URL: http://api:3001/q3/events
      Q3JS_EVENT_CLIENT_SECRET: ${Q3JS_EVENT_CLIENT_SECRET:-bet1v1-q3-local-event-secret-change-me}
      Q3JS_RCON_PASSWORD: ${Q3JS_RCON_PASSWORD:-}
      Q3JS_PUBLISH_HOST: ${Q3JS_PUBLISH_HOST:-localhost}
      Q3JS_PUBLISH_PORT: ${Q3JS_PUBLISH_PORT:-27961}
      Q3JS_SECURE: ${Q3JS_SECURE:-false}
      Q3JS_SERVER_CONFIG: >-
        sets fs_game "q3js";
        seta sv_hostname "Bet 1v1 Q3JS";
        seta sv_maxclients "2";
        seta g_gametype "1";
        seta fraglimit "${QUAKE3_FRAG_LIMIT:-10}";
        seta timelimit "0";
        map q3dm17
    ports:
      - "27960:27960/udp"
      - "${Q3_GATEWAY_BIND_ADDRESS:-0.0.0.0}:27961:27961/tcp"
    volumes:
      - ./bet1v1-quake-3-js-server/baseq3:/data/baseq3:ro
      - bet1v1-quake-3-js-server-state:/state
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:27961/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  cs2-data:
  bet1v1-quake-3-js-server-state:
